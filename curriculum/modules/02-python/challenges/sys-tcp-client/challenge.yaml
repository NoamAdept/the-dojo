id: sys-tcp-client
module: python
title: Write a Local TCP Client
difficulty: medium
estimated_time: 50-80 minutes
prerequisites:
- sys-process-controller
objectives:
- operating_system_apis
- error_handling
- resource_lifetimes
mastery_evidence:
- understand
- observe
- apply
description: 'TCP is a reliable stream of bytes. connect joins a socket to an IP address
  and a port.


  Your task: Complete client.py. It must connect only to the local test server. It
  sends PING and prints PONG.


  Start with `./run`. Read `README.md`. Edit the starter files. Use

  `./check` whenever you want feedback. Everything runs in this one workspace.

  You do not need hardware, a network download, or a remote Git repository.

  '
environment:
  type: workspace
  workspace_subdir: sys-tcp-client
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.
files:
- README.md
- check
- check_fixture.py
- client.py
- run
expected_tools:
- python3
- ./run
- ./check
flags:
  value: flag{sys_tcp_client}
  validation: session
hints:
- level: 1
  text: 'Run `./run` first and read its output. Then look at the starter file and
    the README.

    '
- level: 2
  text: 'Work on one result you can see at a time. Run `./check` again after each change.

    '
- level: 3
  text: 'Complete client.py. It must connect only to the local test server. It sends
    PING and prints PONG.

    '
- level: 4
  text: 'Still stuck? The solution section names the key command or API.

    '
solution: 'Use `socket.create_connection(("127.0.0.1",port))`, sendall PING plus newline,
  recv, decode, and print.


  After making the change, run `./run` and then `./check`.

  '
explanation: 'The client sends the exact request and gets the exact response on localhost.
  The checker tests what the program does, not how you wrote it.

  So any correct solution that does the same thing is accepted.

  '
extension:
  title: Change one parameter
  description: 'After you get the flag, change one input value. Guess the result first.
    Then update

    your code so it stays correct. Do not write the answer directly into the code.

    '

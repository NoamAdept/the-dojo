id: py-control-flow
module: python
title: Classify Signal Strengths
difficulty: easy
estimated_time: 25-40 minutes
prerequisites: []
objectives:
- python-functions
- conditionals
- loops
mastery_evidence:
- understand
- observe
- apply
description: 'Complete `classify.py`. The `classify_signal(snr)` function returns a label:

  `weak` below 5, `usable` from 5 to 14, and `strong` at 15 or more.

  `summarize(values)` must count each label. It returns a dictionary.

  The command-line program in the file must still work.

  '
environment:
  type: workspace
  workspace_subdir: py-control-flow
  notes: Software-only; any networking stays on localhost.
files:
- README.md
- classify.py
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{branches_choose_the_path}
  validation: session
hints:
- level: 1
  text: 'Use an `if`/`elif`/`else` chain. You can also test the strongest condition first.

    '
- level: 2
  text: 'Before the loop, make a dictionary. Set the count for all three labels to zero.

    '
- level: 3
  text: 'For each value, call `classify_signal`. Then add 1 to that label in the dictionary.

    '
solution: 'Implement the three ranges with `if snr < 5`, `elif snr < 15`, and

  `else`. In `summarize`, initialize all counts to zero and update the key returned

  by `classify_signal` for each number.

  '
explanation: 'A conditional branch chooses one path. The choice depends on a value.

  The order of the tests matters. When `snr < 5` is false, the second test only needs

  to check the upper edge. A loop uses the same rule on every sample.

  '
extension:
  title: Go further
  description: 'Change the input data. Make your solution handle the new case.

    Do not change the output format.

    '
performance_notes: 'Inputs are intentionally tiny and run comfortably on a Raspberry
  Pi.

  '
optional_hardware: []

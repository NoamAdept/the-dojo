id: sys-pipes
module: systems-programming
title: Connect Parent and Child with a Pipe
difficulty: medium
estimated_time: 45-70 minutes
prerequisites:
- sys-file-descriptors
objectives:
- operating_system_apis
- error_handling
- resource_lifetimes
mastery_evidence:
- understand
- observe
- apply
description: 'A pipe is a one-way stream of bytes between processes.


  Your task: Complete pipe_demo.cpp. A child process writes `samples=64`. Its parent
  process reads it and prints it.


  Start with `./run`. Read `README.md`. Edit the starter files. Use `./check`
  whenever you want feedback. Everything runs in this one workspace. You do not
  need hardware, a network download, or a remote Git repository.

  '
environment:
  type: workspace
  workspace_subdir: sys-pipes
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.
files:
- README.md
- check
- pipe_demo.cpp
- run
expected_tools:
- g++
- python3
- ./run
- ./check
flags:
  value: flag{sys_pipes}
  validation: session
hints:
- level: 1
  text: 'Run `./run` first and read its output. Then look at the starter file and
    the README.

    '
- level: 2
  text: 'Fix one result at a time. Choose a result you can see in the output. Run
    `./check` again after each change.

    '
- level: 3
  text: 'Call `pipe(fds)` before `fork()`. The child writes into `fds[1]`. The parent
    reads from `fds[0]`.

    '
- level: 4
  text: 'Does the program hang (stop and never finish)? Then a write end is still open.
    The child closes `fds[0]`. The parent closes `fds[1]` before it reads. Then the
    parent calls `wait(nullptr)`.

    '
solution: 'Call pipe then fork. The child closes the read end and writes `samples=64`;
  the parent closes the write end, reads, prints, and waits.


  After making the change, run `./run` and then `./check`.

  '
explanation: 'Each process closes the correct pipe end, so the message arrives and
  the program ends. The checker tests what the program does, not how you wrote it.
  So any other correct solution is also accepted.

  '
extension:
  title: Change one parameter
  description: 'After you get the flag, change one input value. Guess the result
    first. Then update your code so it is still correct. Do not hard-code the answer
    (do not write the expected result straight into the code).

    '

id: sys-process-controller
module: systems-programming
title: Control a Child Process
difficulty: medium
estimated_time: 45-70 minutes
prerequisites:
- sys-pipes
objectives:
- operating_system_apis
- error_handling
- resource_lifetimes
mastery_evidence:
- understand
- observe
- apply
description: 'fork creates a child process. exec replaces the program in the child.
  waitpid collects the status of the child.


  Your task: Complete controller.cpp. It must run `/bin/echo child_ok` in a child.
  Then it must check that the exit status is zero.


  Start with `./run`. Read `README.md`. Edit the starter files. Use `./check`
  whenever you want feedback. Everything runs in this one workspace. You do not
  need hardware, a network download, or a remote Git repository.

  '
environment:
  type: workspace
  workspace_subdir: sys-process-controller
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.
files:
- README.md
- check
- controller.cpp
- run
expected_tools:
- g++
- python3
- ./run
- ./check
flags:
  value: flag{sys_process_controller}
  validation: session
hints:
- level: 1
  text: 'Run `./run` first and read its output. Then look at the starter file and
    the README.

    '
- level: 2
  text: 'Fix one result at a time. Choose a result you can see in the output. Run
    `./check` again after each change.

    '
- level: 3
  text: 'In the child (where fork returned 0), call `execl`. In the parent, call
    `waitpid(pid, &status, 0)`.

    '
- level: 4
  text: 'End the execl argument list with `static_cast<char *>(nullptr)`. Then print
    `child_status=` and after it `WEXITSTATUS(status)`.

    '
solution: 'The child calls `execl("/bin/echo", "echo", "child_ok", static_cast<char *>(nullptr))`; the parent
  waitpid''s it and prints WEXITSTATUS.


  After making the change, run `./run` and then `./check`.

  '
explanation: 'The controller runs the child, waits for it, and prints child_status=0.
  The checker tests what the program does, not how you wrote it. So any other correct
  solution is also accepted.

  '
extension:
  title: Change one parameter
  description: 'After you get the flag, change one input value. Guess the result
    first. Then update your code so it is still correct. Do not hard-code the answer
    (do not write the expected result straight into the code).

    '

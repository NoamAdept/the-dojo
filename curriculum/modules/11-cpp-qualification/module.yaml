title: C++ Qualification
order: 10
description: 'The team C++17 qualification. Each challenge is C++ code that you write, compile and
  test. The topics are: namespaces, strings and files, OOP and patterns, const/volatile, pointers, modern
  C++, the STL, RAII, error handling, CMake, package management, low-level data, templates, concurrency
  and networking, and ISR-style code.'

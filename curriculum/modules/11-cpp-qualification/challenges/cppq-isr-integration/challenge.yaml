id: cppq-isr-integration
module: cpp-qualification
title: Interrupt Service Routines
difficulty: hard
estimated_time: 60-90 minutes
prerequisites: []
objectives:
- extern_c
- volatile_flags
- static_member_isr
- debounce
- ring_buffer
- callback_dispatch
- signals
mastery_evidence:
- understand
- implement
- apply
description: |
  In this challenge you will write:

  - handlers with C linkage
  - volatile and atomic flags
  - ISRs (interrupt handlers) that are static class members
  - a debouncer (it ignores repeated button presses)
  - a lock-free ring buffer for 1 producer
  - a callback dispatcher

  Then you will run one handler from a real POSIX signal.

  Read `README.md` and do the tasks. Run `./check` until it prints `CHECK_OK`. Then press Done.
environment:
  type: workspace
  notes: Software-only and offline. Runs on a Raspberry Pi.
files:
- README.md
- check
- check.py
- tasks.h
- tests/check.h
- tests/task1.cpp
- tests/task2.cpp
- tests/task3.cpp
- tests/task4.cpp
- tests/task5.cpp
- tests/task6.cpp
- tests/task7.cpp
expected_tools:
- g++
- python3
flags:
  value: flag{cppq_isr_integration}
  validation: session
hints:
- level: 1
  text: '`extern "C"` turns off C++ name mangling. Then the vector table (or a C linker script) can find
    the handler by its plain name.'
- level: 2
  text: A ring buffer is full when `(head + 1) % N == tail`. Always keep 1 slot empty. Then you can tell
    "full" and "empty" apart without a counter.
- level: 3
  text: 'A signal handler may only do async-signal-safe work (work that is safe inside a signal). So set
    a `volatile std::sig_atomic_t` flag and return.'
solution: A complete reference implementation is in this challenge's `solution/` folder (instructor copy,
  not staged into the workspace).
explanation: 'An ISR can stop the main program at any point. So an ISR must be short. It must share data
  only through volatile or atomic variables. It must not use locks or allocate memory. Static methods
  and lambdas with no captures can become plain function pointers. This is how C++ code connects to C
  interrupt tables.'
extension:
  title: Go further
  description: Add one more test of your own to check.py and make it pass.
optional_hardware: []

id: cppq-stl
module: cpp-qualification
title: STL Containers, Algorithms and Iterators
difficulty: medium
estimated_time: 45-60 minutes
prerequisites: []
objectives:
- vector
- map
- set
- sort_comparators
- max_element
- stringstream
mastery_evidence:
- understand
- implement
- apply
description: |
  In this challenge you will:

  - use vector, map and set
  - sort from high to low (descending), and sort with your own lambdas
  - find the largest value with `std::max_element`
  - count words with a stringstream and a map

  Read `README.md` and do the tasks. Run `./check` until it prints `CHECK_OK`. Then press Done.
environment:
  type: workspace
  notes: Software-only and offline. Runs on a Raspberry Pi.
files:
- README.md
- check
- check.py
- tasks.h
- tests/check.h
- tests/task1.cpp
- tests/task2.cpp
- tests/task3.cpp
- tests/task4.cpp
- tests/task5.cpp
- tests/task6.cpp
- tests/task7.cpp
expected_tools:
- g++
- python3
flags:
  value: flag{cppq_stl}
  validation: session
hints:
- level: 1
  text: 'When the key is missing, `book.find(name)` returns `book.end()`. Do not use `operator[]` here.
    It would add a new empty entry.'
- level: 2
  text: 'If you build a set from a range, it removes copies: `std::set<std::string>(v.begin(), v.end())`.'
- level: 3
  text: A comparator returns true when `a` must come before `b`. Compare the scores first. Compare the
    names only when the scores are equal (a tie).
solution: A complete reference implementation is in this challenge's `solution/` folder (instructor copy,
  not staged into the workspace).
explanation: 'The STL has 3 separate parts. Containers say how data is stored. Iterators say how to walk
  through it. Algorithms say what to do with it. Choose a container for what it promises. Use a vector
  for fast access to elements that sit next to each other in memory (contiguous). Use a map when the keys
  must stay in order. Use a set when each value must appear only once.'
extension:
  title: Go further
  description: Add one more test of your own to check.py and make it pass.
optional_hardware: []

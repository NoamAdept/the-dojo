id: cppq-oop-patterns
module: cpp-qualification
title: OOP and Design Patterns
difficulty: medium
estimated_time: 45-75 minutes
prerequisites: []
objectives:
- classes
- encapsulation
- singleton
- factory
- observer
- polymorphism
mastery_evidence:
- understand
- implement
- apply
description: |
  In this challenge you will write:

  - encapsulated classes (classes that keep their data private)
  - a Singleton logger
  - a bank account with invariants (rules that must always be true)
  - an abstract factory of shapes that returns `unique_ptr`
  - an observer pattern for sensor readings

  Read `README.md` and do the tasks. Run `./check` until it prints `CHECK_OK`. Then press Done.
environment:
  type: workspace
  notes: Software-only and offline. Runs on a Raspberry Pi.
files:
- README.md
- check
- check.py
- tasks.h
- tests/check.h
- tests/task1.cpp
- tests/task2.cpp
- tests/task3.cpp
- tests/task4.cpp
- tests/task5.cpp
- tests/task6.cpp
- tests/task7.cpp
expected_tools:
- g++
- python3
flags:
  value: flag{cppq_oop_patterns}
  validation: session
hints:
- level: 1
  text: A Meyers singleton is a `static Logger logger;` that lives inside the function `instance()`. Since
    C++11, its initialization is thread-safe.
- level: 2
  text: A class with `virtual ... = 0` is abstract. If you use a base class through pointers, give it
    a `virtual ~Shape() = default;`.
- level: 3
  text: Sensor stores `Observer*` pointers. It does not own them. So it does not delete them.
solution: A complete reference implementation is in this challenge's `solution/` folder (instructor copy,
  not staged into the workspace).
explanation: Encapsulation protects invariants, such as an age range or a balance that is never below
  zero. Singleton gives one shared instance. Factory hides which concrete class it builds. Observer keeps
  a data source separate from the things that react to it.
extension:
  title: Go further
  description: Add one more test of your own to check.py and make it pass.
optional_hardware: []

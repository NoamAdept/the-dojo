id: lls-globbing
module: linux-shell-basics
title: File Globbing
difficulty: easy
estimated_time: 30-45 minutes
prerequisites: []
objectives:
- glob_star
- glob_question
- glob_brackets
- glob_exclusion
- tab_completion
mastery_evidence:
- understand
- implement
- apply
description: |
  Let the shell expand file names for you with globs (patterns for file names): *, ? and [].
  This includes [!...] globs, which leave names out.
  You also see how tab completion works, with compgen.

  Read `README.md` and do the tasks. Run `./check` until it prints `CHECK_OK`. Then press Done.
environment:
  type: workspace
  notes: Software-only and offline. Runs on a Raspberry Pi.

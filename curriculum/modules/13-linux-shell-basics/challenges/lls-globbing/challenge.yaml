hints:
- level: 1
  text: 'Test globs with `echo` first: `cd "$DOJO/challenge/words"; echo *p*` shows exactly what a command would get.'
- level: 2
  text: 'Keep the glob part outside the double quotes: `"$DOJO"/challenge/files/file_[absh]`.'
- level: 3
  text: 'Task 6: look at the first letters of the 3 words you need. Task 10: `compgen -c` can list a name 2 times. `| sort -u` removes the duplicates.'
solution: A complete reference implementation is in this challenge's `solution/` folder (instructor copy,
  not staged into the workspace).
explanation: 'The shell expands *, ? and [] before the program starts. So the program only sees a list of file names. Inside quotes, globs are not expanded. Tab completion uses the same system. compgen prints the possible names, so scripts can use them.'
extension:
  title: Go further
  description: 'Try `shopt -s nullglob` and `shopt -s dotglob`. See how the output of `echo nope_*` and `echo *` changes.'
optional_hardware: []
